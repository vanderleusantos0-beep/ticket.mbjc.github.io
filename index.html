<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBJC Ticket & Bewerbungssystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at 50% -20%, #1e1b4b, #090d16 60%, #030712);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .liquid-glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }
    .liquid-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .liquid-input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center justify-between">

  <div id="root" class="w-full max-w-4xl z-10"></div>

  <script type="text/babel">
    const CONFIG = {
      serverName: "MBJC Network",
      mainSite: "http://mbjc.info/",
      discordUrl: "https://discord.gg/2Nuwdyr4tZ",
      // Hier optional deinen Discord-Webhook für Benachrichtigungen eintragen:
      webhookUrl: "",
      // Passwort für den Admin-Bereich (Hier ändern falls gewünscht):
      adminPassword: "mbjc2026admin"
    };

    function App() {
      const [view, setView] = React.useState("form"); // "form", "success", "adminLogin", "adminPanel"
      const [role, setRole] = React.useState("discord_mod");
      const [adminPass, setAdminPass] = React.useState("");
      const [adminError, setAdminError] = React.useState(false);
      const [applications, setApplications] = React.useState([]);
      const [selectedApp, setSelectedApp] = React.useState(null);

      // Formulardaten
      const [formData, setFormData] = React.useState({
        discordTag: "",
        age: "",
        experience: "",
        motivation: "",
        scenario: "",
        weeklyHours: ""
      });

      const [submittedTicket, setSubmittedTicket] = React.useState(null);

      // Lade Bewerbungen aus LocalStorage für Admin-Einsicht
      React.useEffect(() => {
        const saved = localStorage.getItem("mbjc_applications");
        if (saved) {
          try { setApplications(JSON.parse(saved)); } catch(e){}
        }
      }, []);

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const ticketId = "MBJC-TICK-" + Math.floor(1000 + Math.random() * 9000);
        const newApp = {
          id: ticketId,
          role: role === "discord_mod" ? "Discord Moderator" : "TikTok Moderator",
          data: formData,
          status: "Offen",
          date: new Date().toLocaleString("de-DE")
        };

        // Speichern
        const updatedApps = [newApp, ...applications];
        setApplications(updatedApps);
        localStorage.setItem("mbjc_applications", JSON.stringify(updatedApps));

        // Send Webhook falls konfiguriert
        if (CONFIG.webhookUrl) {
          fetch(CONFIG.webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              embeds: [{
                title: `📥 Neue Bewerbung: ${newApp.role}`,
                color: 6547697,
                fields: [
                  { name: "Ticket ID", value: newApp.id, inline: true },
                  { name: "Discord Tag", value: formData.discordTag, inline: true },
                  { name: "Alter", value: formData.age, inline: true },
                  { name: "Verfügbarkeit", value: `${formData.weeklyHours} Std/Woche`, inline: true },
                  { name: "Erfahrung", value: formData.experience || "Keine Angabe" },
                  { name: "Motivation", value: formData.motivation || "Keine Angabe" },
                  { name: "Szenario Antwort", value: formData.scenario || "Keine Angabe" }
                ],
                footer: { text: "MBJC Admin Ticket System" },
                timestamp: new Date().toISOString()
              }]
            })
          }).catch(err => console.log("Webhook Error:", err));
        }

        setSubmittedTicket(newApp);
        setView("success");
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === CONFIG.adminPassword) {
          setAdminError(false);
          setView("adminPanel");
        } else {
          setAdminError(true);
        }
      };

      const updateAppStatus = (id, newStatus) => {
        const updated = applications.map(app => app.id === id ? { ...app, status: newStatus } : app);
        setApplications(updated);
        localStorage.setItem("mbjc_applications", JSON.stringify(updated));
        if (selectedApp && selectedApp.id === id) {
          setSelectedApp({ ...selectedApp, status: newStatus });
        }
      };

      const deleteApp = (id) => {
        if (confirm("Bewerbung wirklich löschen?")) {
          const updated = applications.filter(app => app.id !== id);
          setApplications(updated);
          localStorage.setItem("mbjc_applications", JSON.stringify(updated));
          if (selectedApp && selectedApp.id === id) setSelectedApp(null);
        }
      };

      return (
        <div className="w-full">
          {/* HEADER BAR */}
          <div className="flex justify-between items-center mb-8">
            <a href={CONFIG.mainSite} className="flex items-center gap-2 text-slate-300 hover:text-white font-bold text-sm">
              <i className="fa-solid fa-arrow-left"></i> Hauptseite (mbjc.info)
            </a>
            <button 
              onClick={() => setView(view === "adminPanel" ? "form" : "adminLogin")} 
              className="bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/30 text-indigo-300 text-xs px-4 py-2 rounded-xl transition font-semibold flex items-center gap-2"
            >
              <i className="fa-solid fa-user-shield"></i>
              {view === "adminPanel" ? "Bewerbungsformular" : "Admin Panel"}
            </button>
          </div>

          {/* VIEW: ADMIN LOGIN */}
          {view === "adminLogin" && (
            <div className="liquid-glass rounded-3xl p-8 max-w-md mx-auto text-center border border-indigo-500/30">
              <div className="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center mx-auto mb-4 text-indigo-400 text-2xl">
                <i className="fa-solid fa-lock"></i>
              </div>
              <h2 className="text-2xl font-black mb-2">Admin Bereich Login</h2>
              <p className="text-xs text-slate-400 mb-6">Bitte gebe das Admin-Passwort ein, um alle Bewerbungen zu verwalten.</p>

              <form onSubmit={handleAdminLogin} className="space-y-4">
                <input 
                  type="password" 
                  placeholder="Passwort eingeben"
                  value={adminPass}
                  onChange={(e) => setAdminPass(e.target.value)}
                  className="w-full liquid-input p-3.5 rounded-xl text-center text-sm"
                  required
                />
                {adminError && <p className="text-rose-400 text-xs font-semibold">Falsches Passwort!</p>}
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-sm">
                  Einloggen
                </button>
              </form>
            </div>
          )}

          {/* VIEW: ADMIN PANEL */}
          {view === "adminPanel" && (
            <div className="liquid-glass rounded-3xl p-6 md:p-8">
              <div className="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4 mb-6">
                <div>
                  <h2 className="text-2xl font-black text-white flex items-center gap-2">
                    <i className="fa-solid fa-clipboard-list text-indigo-400"></i> Admin Dashboard
                  </h2>
                  <p className="text-xs text-slate-400">Übersicht aller eingereichten Bewerbungen ({applications.length})</p>
                </div>
                <button onClick={() => setView("form")} className="text-xs text-slate-400 hover:text-white">
                  ← Zurück zum Formular
                </button>
              </div>

              {applications.length === 0 ? (
                <div className="text-center py-12 text-slate-500">
                  <i className="fa-solid fa-inbox text-4xl mb-3"></i>
                  <p>Keine eingegangenen Bewerbungen vorhanden.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* LISTE DER BEWERBUNGEN */}
                  <div className="md:col-span-1 space-y-3 max-h-[600px] overflow-y-auto pr-2">
                    {applications.map((app) => (
                      <div 
                        key={app.id} 
                        onClick={() => setSelectedApp(app)}
                        className={`p-4 rounded-2xl cursor-pointer border transition ${selectedApp?.id === app.id ? 'bg-indigo-600/30 border-indigo-500' : 'bg-slate-900/40 border-slate-800 hover:border-slate-700'}`}
                      >
                        <div className="flex justify-between items-start mb-1">
                          <span className="text-xs font-mono text-indigo-400 font-bold">{app.id}</span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                            app.status === 'Angenommen' ? 'bg-emerald-500/20 text-emerald-400' :
                            app.status === 'Abgelehnt' ? 'bg-rose-500/20 text-rose-400' :
                            app.status === 'In Bearbeitung' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-700 text-slate-300'
                          }`}>
                            {app.status}
                          </span>
                        </div>
                        <p className="font-bold text-sm text-white">{app.data.discordTag}</p>
                        <p className="text-xs text-slate-400">{app.role}</p>
                        <p className="text-[10px] text-slate-500 mt-2">{app.date}</p>
                      </div>
                    ))}
                  </div>

                  {/* DETAILANSICHT */}
                  <div className="md:col-span-2 bg-slate-900/60 border border-slate-800 rounded-2xl p-6">
                    {selectedApp ? (
                      <div className="space-y-6">
                        <div className="flex justify-between items-start border-b border-slate-800 pb-4">
                          <div>
                            <span className="text-xs font-mono text-indigo-400 font-bold">{selectedApp.id}</span>
                            <h3 className="text-xl font-bold text-white">{selectedApp.data.discordTag}</h3>
                            <p className="text-xs text-slate-400">{selectedApp.role} &bull; Alter: {selectedApp.data.age}</p>
                          </div>
                          <button onClick={() => deleteApp(selectedApp.id)} className="text-rose-400 hover:text-rose-300 text-xs font-bold">
                            <i className="fa-solid fa-trash mr-1"></i> Löschen
                          </button>
                        </div>

                        {/* STATUS ÄNDERN BUTTONS */}
                        <div>
                          <p className="text-xs text-slate-400 uppercase font-bold mb-2">Status Ändern:</p>
                          <div className="flex flex-wrap gap-2">
                            {['Offen', 'In Bearbeitung', 'Angenommen', 'Abgelehnt'].map((st) => (
                              <button 
                                key={st} 
                                onClick={() => updateAppStatus(selectedApp.id, st)}
                                className={`text-xs px-3 py-1.5 rounded-xl font-bold border transition ${
                                  selectedApp.status === st ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-white'
                                }`}
                              >
                                {st}
                              </button>
                            ))}
                          </div>
                        </div>

                        {/* FRAGEN & ANTWORTEN */}
                        <div className="space-y-4 text-sm">
                          <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Verfügbarkeit / Stunden:</p>
                            <p className="text-slate-200 mt-1">{selectedApp.data.weeklyHours} Stunden pro Woche</p>
                          </div>
                          <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Bisherige Erfahrung:</p>
                            <p className="text-slate-200 mt-1 whitespace-pre-wrap">{selectedApp.data.experience}</p>
                          </div>
                          <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Motivation:</p>
                            <p className="text-slate-200 mt-1 whitespace-pre-wrap">{selectedApp.data.motivation}</p>
                          </div>
                          <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Szenario-Lösung:</p>
                            <p className="text-slate-200 mt-1 whitespace-pre-wrap">{selectedApp.data.scenario}</p>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="h-full flex flex-col items-center justify-center text-slate-500 py-12">
                        <i className="fa-regular fa-hand-pointer text-3xl mb-2"></i>
                        <p className="text-xs">Wähle links eine Bewerbung aus, um Details anzuzeigen.</p>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* VIEW: USER FORMULAR */}
          {view === "form" && (
            <div className="liquid-glass rounded-3xl p-8 border border-white/10">
              <div className="text-center mb-8">
                <h1 className="text-3xl font-black text-white">MBJC Team Bewerbung</h1>
                <p className="text-xs text-slate-400 mt-1">Wähle die gewünschte Position und beantworte die Fragen.</p>
              </div>

              {/* ROLE SWITCHER */}
              <div className="grid grid-cols-2 gap-3 mb-8 p-1.5 bg-slate-900/80 rounded-2xl border border-slate-800">
                <button 
                  type="button"
                  onClick={() => setRole("discord_mod")}
                  className={`py-3 rounded-xl text-xs md:text-sm font-bold transition flex items-center justify-center gap-2 ${role === "discord_mod" ? "bg-indigo-600 text-white shadow-lg" : "text-slate-400 hover:text-white"}`}
                >
                  <i className="fa-brands fa-discord"></i> Discord Moderator
                </button>
                <button 
                  type="button"
                  onClick={() => setRole("tiktok_mod")}
                  className={`py-3 rounded-xl text-xs md:text-sm font-bold transition flex items-center justify-center gap-2 ${role === "tiktok_mod" ? "bg-indigo-600 text-white shadow-lg" : "text-slate-400 hover:text-white"}`}
                >
                  <i className="fa-brands fa-tiktok"></i> TikTok Moderator
                </button>
              </div>

              <form onSubmit={handleSubmit} className="space-y-5">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Dein Discord Username / Tag *</label>
                    <input 
                      type="text" 
                      name="discordTag" 
                      placeholder="z.B. user_123" 
                      value={formData.discordTag} 
                      onChange={handleChange} 
                      className="w-full liquid-input p-3 rounded-xl text-sm" 
                      required 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Dein Alter *</label>
                    <input 
                      type="number" 
                      name="age" 
                      placeholder="z.B. 16" 
                      value={formData.age} 
                      onChange={handleChange} 
                      className="w-full liquid-input p-3 rounded-xl text-sm" 
                      required 
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1.5">Wie viel Zeit kannst du pro Woche aufbringen? (in Stunden) *</label>
                  <input 
                    type="number" 
                    name="weeklyHours" 
                    placeholder="z.B. 10" 
                    value={formData.weeklyHours} 
                    onChange={handleChange} 
                    className="w-full liquid-input p-3 rounded-xl text-sm" 
                    required 
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1.5">Hast du bereits Erfahrung als Moderator? *</label>
                  <textarea 
                    name="experience" 
                    rows="3" 
                    placeholder="Erzähle kurz von früheren Servern oder Moderations-Aufgaben..." 
                    value={formData.experience} 
                    onChange={handleChange} 
                    className="w-full liquid-input p-3 rounded-xl text-sm" 
                    required
                  ></textarea>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1.5">Warum möchtest du ausgerechnet ins MBJC Team? *</label>
                  <textarea 
                    name="motivation" 
                    rows="3" 
                    placeholder="Deine Motivation und was dich auszeichnet..." 
                    value={formData.motivation} 
                    onChange={handleChange} 
                    className="w-full liquid-input p-3 rounded-xl text-sm" 
                    required
                  ></textarea>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1.5">
                    {role === "discord_mod" 
                      ? "Szenario: Zwei User streiten sich heftig im Textkanal und beleidigen sich. Wie reagierst du?" 
                      : "Szenario: Im TikTok-Livestream spammst jemand Hasskommentare. Wie gehst du vor?"} *
                  </label>
                  <textarea 
                    name="scenario" 
                    rows="3" 
                    placeholder="Beschreibe deine Vorgehensweise..." 
                    value={formData.scenario} 
                    onChange={handleChange} 
                    className="w-full liquid-input p-3 rounded-xl text-sm" 
                    required
                  ></textarea>
                </div>

                <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-4 px-6 rounded-xl transition duration-200 shadow-xl shadow-indigo-600/30">
                  <i className="fa-solid fa-paper-plane mr-2"></i> Bewerbung Absenden
                </button>
              </form>
            </div>
          )}

          {/* VIEW: ERFOLG */}
          {view === "success" && submittedTicket && (
            <div className="liquid-glass rounded-3xl p-8 text-center border border-emerald-500/30 max-w-lg mx-auto">
              <div className="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto mb-4 text-emerald-400 text-3xl">
                <i className="fa-solid fa-check"></i>
              </div>
              <h2 className="text-2xl font-black text-white mb-1">Bewerbung Eingegangen!</h2>
              <p className="text-xs text-slate-400 mb-4">Deine Ticket-Nummer:</p>
              
              <div className="bg-slate-900 p-3 rounded-xl font-mono text-indigo-400 font-bold text-lg mb-6 border border-slate-800">
                {submittedTicket.id}
              </div>

              <p className="text-xs text-slate-300 leading-relaxed mb-6">
                Unsere Admins wurden benachrichtigt und prüfen deine Daten. Du kannst den aktuellen Status deiner Bewerbung jederzeit einsehen.
              </p>

              <div className="flex gap-3">
                <button onClick={() => setView("form")} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs transition">
                  Neue Bewerbung
                </button>
                <a href={CONFIG.discordUrl} target="_blank" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition flex items-center justify-center gap-1">
                  <i className="fa-brands fa-discord"></i> Zum Discord
                </a>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
