<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBJC | Team Bewerbung & Ticket Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at 50% -20%, #1e1b4b, #090d16 60%, #030712);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .liquid-glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }
    .liquid-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.2s ease;
    }
    .liquid-input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center justify-between">

  <div id="root" class="w-full max-w-4xl z-10"></div>

  <script type="text/babel">
    const CONFIG = {
      serverName: "MBJC Network",
      mainSite: "http://mbjc.info/",
      discordUrl: "https://discord.gg/2Nuwdyr4tZ",
      // FÜGE HIER DEINE DISCORD WEBHOOK URL EIN:
      webhookUrl: "DEIN_DISCORD_WEBHOOK_HIER_EINFUEGEN"
    };

    function App() {
      const [view, setView] = React.useState("form"); // "form", "success", "adminLogin", "adminPanel"
      const [role, setRole] = React.useState("discord_mod");
      
      // Admin 2FA Code Status
      const [codeSent, setCodeSent] = React.useState(false);
      const [generatedCode, setGeneratedCode] = React.useState("");
      const [inputCode, setInputCode] = React.useState("");
      const [adminError, setAdminError] = React.useState("");
      const [isSendingCode, setIsSendingCode] = React.useState(false);

      const [applications, setApplications] = React.useState([]);
      const [selectedApp, setSelectedApp] = React.useState(null);
      const [searchTerm, setSearchTerm] = React.useState("");
      const [filterStatus, setFilterStatus] = React.useState("Alle");
      const [isAppOpen, setIsAppOpen] = React.useState(true);

      const [formData, setFormData] = React.useState({
        discordTag: "",
        age: "",
        weeklyHours: "",
        activeTimes: "Nachmittags & Abends",
        experience: "",
        botKnowledge: "",
        motivation: "",
        strengthsWeaknesses: "",
        scenario1: "",
        scenario2: ""
      });

      const [submittedTicket, setSubmittedTicket] = React.useState(null);

      React.useEffect(() => {
        const savedApps = localStorage.getItem("mbjc_applications");
        if (savedApps) {
          try { setApplications(JSON.parse(savedApps)); } catch(e){}
        }

        const savedStatus = localStorage.getItem("mbjc_app_status");
        if (savedStatus !== null) {
          setIsAppOpen(JSON.parse(savedStatus));
        }
      }, []);

      const toggleAppStatus = (open) => {
        setIsAppOpen(open);
        localStorage.setItem("mbjc_app_status", JSON.stringify(open));
      };

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      // 1-MAL-CODE GENERIEREN UND ÜBER DISCORD WEBHOOK SENDEN
      const sendDiscordAdminCode = async () => {
        if (!CONFIG.webhookUrl || CONFIG.webhookUrl.includes("DEIN_DISCORD_WEBHOOK")) {
          setAdminError("Bitte trage deine Discord Webhook URL in CONFIG.webhookUrl ein!");
          return;
        }

        setIsSendingCode(true);
        setAdminError("");

        // Generiere zufälligen 6-stelligen Code
        const newCode = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedCode(newCode);

        try {
          const res = await fetch(CONFIG.webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              content: "🔐 **MBJC Admin Login Anforderung**",
              embeds: [{
                title: "🛡️ Einmaliger Admin-Sicherheitscode",
                color: 6507761,
                description: `Ein Admin versucht sich gerade auf **ticket.mbjc.info** einzuloggen.\n\nDein Code lautet: **\`${newCode}\`**\n\n*(Dieser Code ist nur für einen Login-Versuch gültig)*`,
                footer: { text: "MBJC Security System" },
                timestamp: new Date().toISOString()
              }]
            })
          });

          if (res.ok || res.status === 204) {
            setCodeSent(true);
          } else {
            setAdminError("Fehler beim Senden über Discord Webhook.");
          }
        } catch (err) {
          setAdminError("Netzwerkfehler beim Senden des Codes.");
        } finally {
          setIsSendingCode(false);
        }
      };

      // CODE ÜBERPRÜFEN
      const handleVerifyCode = (e) => {
        e.preventDefault();
        if (inputCode.trim() === generatedCode && generatedCode !== "") {
          setAdminError("");
          setGeneratedCode(""); // Code entwerten
          setInputCode("");
          setView("adminPanel");
        } else {
          setAdminError("Falscher oder abgelaufener Code!");
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!isAppOpen) return;

        const ticketId = "MBJC-TICK-" + Math.floor(1000 + Math.random() * 9000);
        const newApp = {
          id: ticketId,
          role: role === "discord_mod" ? "Discord Moderator" : "TikTok Moderator",
          data: { ...formData },
          status: "Offen",
          date: new Date().toLocaleString("de-DE")
        };

        const updatedApps = [newApp, ...applications];
        setApplications(updatedApps);
        localStorage.setItem("mbjc_applications", JSON.stringify(updatedApps));

        if (CONFIG.webhookUrl && !CONFIG.webhookUrl.includes("DEIN_DISCORD_WEBHOOK")) {
          fetch(CONFIG.webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              embeds: [{
                title: `📥 Neue Bewerbung: ${newApp.role}`,
                color: 6547697,
                fields: [
                  { name: "Ticket ID", value: newApp.id, inline: true },
                  { name: "Discord Tag", value: formData.discordTag, inline: true },
                  { name: "Alter", value: formData.age, inline: true },
                  { name: "Motivation", value: formData.motivation || "Keine Angabe" }
                ],
                footer: { text: "MBJC Team Bewerbungssystem" },
                timestamp: new Date().toISOString()
              }]
            })
          }).catch(err => console.log("Webhook Fehler:", err));
        }

        setSubmittedTicket(newApp);
        setView("success");
      };

      const updateAppStatus = (id, newStatus) => {
        const updated = applications.map(app => app.id === id ? { ...app, status: newStatus } : app);
        setApplications(updated);
        localStorage.setItem("mbjc_applications", JSON.stringify(updated));
        if (selectedApp && selectedApp.id === id) {
          setSelectedApp({ ...selectedApp, status: newStatus });
        }
      };

      const deleteApp = (id) => {
        if (confirm("Möchtest du diese Bewerbung wirklich unwiderruflich löschen?")) {
          const updated = applications.filter(app => app.id !== id);
          setApplications(updated);
          localStorage.setItem("mbjc_applications", JSON.stringify(updated));
          if (selectedApp && selectedApp.id === id) setSelectedApp(null);
        }
      };

      const filteredApps = applications.filter(app => {
        const matchesSearch = app.data.discordTag.toLowerCase().includes(searchTerm.toLowerCase()) || app.id.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesStatus = filterStatus === "Alle" || app.status === filterStatus;
        return matchesSearch && matchesStatus;
      });

      return (
        <div className="w-full">
          {/* TOP NAVIGATION */}
          <div className="flex justify-between items-center mb-8">
            <a href={CONFIG.mainSite} className="flex items-center gap-2 text-slate-300 hover:text-white font-bold text-sm transition">
              <i className="fa-solid fa-arrow-left"></i> Zurück zu mbjc.info
            </a>
            <button 
              onClick={() => {
                if (view === "adminPanel") {
                  setView("form");
                } else {
                  setView("adminLogin");
                  setCodeSent(false);
                }
              }} 
              className="bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/30 text-indigo-300 text-xs px-4 py-2 rounded-xl transition font-semibold flex items-center gap-2 shadow-lg"
            >
              <i className="fa-solid fa-user-shield"></i>
              {view === "adminPanel" ? "Bewerbungsformular" : "Admin Panel Login"}
            </button>
          </div>

          {/* VIEW: ADMIN LOGIN MIT DISCORD WEBHOOK 2FA CODE */}
          {view === "adminLogin" && (
            <div className="liquid-glass rounded-3xl p-8 max-w-md mx-auto text-center border border-indigo-500/30 shadow-2xl">
              <div className="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center mx-auto mb-4 text-indigo-400 text-2xl">
                <i className="fa-solid fa-shield-halved"></i>
              </div>
              <h2 className="text-2xl font-black mb-2 text-white">Discord 2FA Login</h2>
              <p className="text-xs text-slate-400 mb-6">
                {!codeSent 
                  ? "Klicke auf den Button, um einen 1-maligen Code an euren Discord Admin-Channel zu senden." 
                  : "Der Code wurde gesendet! Prüfe den Discord-Channel und gib ihn hier ein."}
              </p>

              {!codeSent ? (
                <div className="space-y-4">
                  <button 
                    onClick={sendDiscordAdminCode} 
                    disabled={isSendingCode}
                    className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3.5 px-6 rounded-xl transition text-sm shadow-lg flex items-center justify-center gap-2"
                  >
                    {isSendingCode ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-brands fa-discord"></i>}
                    <span>Code an Discord senden</span>
                  </button>
                  {adminError && <p className="text-rose-400 text-xs font-semibold">{adminError}</p>}
                </div>
              ) : (
                <form onSubmit={handleVerifyCode} className="space-y-4">
                  <input 
                    type="text" 
                    placeholder="6-stelligen Code eingeben"
                    value={inputCode}
                    onChange={(e) => setInputCode(e.target.value)}
                    className="w-full liquid-input p-3.5 rounded-xl text-center text-lg font-mono tracking-widest"
                    maxLength="6"
                    required
                  />
                  {adminError && <p className="text-rose-400 text-xs font-semibold">{adminError}</p>}
                  
                  <div className="flex gap-2">
                    <button 
                      type="button" 
                      onClick={sendDiscordAdminCode}
                      className="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition"
                    >
                      Neu senden
                    </button>
                    <button 
                      type="submit" 
                      className="w-2/3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg"
                    >
                      Einloggen
                    </button>
                  </div>
                </form>
              )}
            </div>
          )}

          {/* VIEW: ADMIN PANEL */}
          {view === "adminPanel" && (
            <div className="liquid-glass rounded-3xl p-6 md:p-8">
              
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-toggle-on text-indigo-400"></i> Status der Bewerbungsphase
                  </h3>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Aktuell: <strong className={isAppOpen ? "text-emerald-400" : "text-rose-400"}>
                      {isAppOpen ? "Bewerbungen GEÖFFNET" : "Bewerbungen GESCHLOSSEN"}
                    </strong>
                  </p>
                </div>

                <div className="flex gap-2 w-full md:w-auto">
                  <button 
                    onClick={() => toggleAppStatus(true)}
                    className={`flex-1 md:flex-none px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 border ${
                      isAppOpen ? "bg-emerald-600 text-white border-emerald-500 shadow-lg shadow-emerald-600/30" : "bg-slate-800 text-slate-400 border-slate-700 hover:text-white"
                    }`}
                  >
                    <i className="fa-solid fa-door-open"></i> Öffnen
                  </button>
                  <button 
                    onClick={() => toggleAppStatus(false)}
                    className={`flex-1 md:flex-none px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 border ${
                      !isAppOpen ? "bg-rose-600 text-white border-rose-500 shadow-lg shadow-rose-600/30" : "bg-slate-800 text-slate-400 border-slate-700 hover:text-white"
                    }`}
                  >
                    <i className="fa-solid fa-door-closed"></i> Schließen
                  </button>
                </div>
              </div>

              <div className="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4 mb-6">
                <div>
                  <h2 className="text-2xl font-black text-white flex items-center gap-2">
                    <i className="fa-solid fa-clipboard-list text-indigo-400"></i> Admin Dashboard
                  </h2>
                  <p className="text-xs text-slate-400">Eingegangene Bewerbungen ({applications.length})</p>
                </div>
                
                <div className="flex flex-wrap items-center gap-2">
                  <input 
                    type="text" 
                    placeholder="Suchen..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="liquid-input px-3 py-1.5 rounded-xl text-xs w-36"
                  />
                  <select 
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="liquid-input px-3 py-1.5 rounded-xl text-xs bg-slate-900"
                  >
                    <option value="Alle">Alle Status</option>
                    <option value="Offen">Offen</option>
                    <option value="In Bearbeitung">In Bearbeitung</option>
                    <option value="Angenommen">Angenommen</option>
                    <option value="Abgelehnt">Abgelehnt</option>
                  </select>
                </div>
              </div>

              {filteredApps.length === 0 ? (
                <div className="text-center py-12 text-slate-500">
                  <i className="fa-solid fa-inbox text-4xl mb-3"></i>
                  <p>Keine Bewerbungen gefunden.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="md:col-span-1 space-y-3 max-h-[500px] overflow-y-auto pr-2">
                    {filteredApps.map((app) => (
                      <div 
                        key={app.id} 
                        onClick={() => setSelectedApp(app)}
                        className={`p-4 rounded-2xl cursor-pointer border transition ${selectedApp?.id === app.id ? 'bg-indigo-600/30 border-indigo-500' : 'bg-slate-900/40 border-slate-800 hover:border-slate-700'}`}
                      >
                        <div className="flex justify-between items-start mb-1">
                          <span className="text-xs font-mono text-indigo-400 font-bold">{app.id}</span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                            app.status === 'Angenommen' ? 'bg-emerald-500/20 text-emerald-400' :
                            app.status === 'Abgelehnt' ? 'bg-rose-500/20 text-rose-400' :
                            app.status === 'In Bearbeitung' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-700 text-slate-300'
                          }`}>
                            {app.status}
                          </span>
                        </div>
                        <p className="font-bold text-sm text-white">{app.data.discordTag}</p>
                        <p className="text-xs text-slate-400">{app.role}</p>
                      </div>
                    ))}
                  </div>

                  <div className="md:col-span-2 bg-slate-900/60 border border-slate-800 rounded-2xl p-6 max-h-[500px] overflow-y-auto">
                    {selectedApp ? (
                      <div className="space-y-4">
                        <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                          <div>
                            <span className="text-xs font-mono text-indigo-400 font-bold">{selectedApp.id}</span>
                            <h3 className="text-xl font-bold text-white">{selectedApp.data.discordTag}</h3>
                            <p className="text-xs text-slate-400">{selectedApp.role} &bull; Alter: {selectedApp.data.age}</p>
                          </div>
                          <button onClick={() => deleteApp(selectedApp.id)} className="text-rose-400 text-xs font-bold">
                            <i className="fa-solid fa-trash mr-1"></i> Löschen
                          </button>
                        </div>

                        <div>
                          <p className="text-xs text-slate-400 uppercase font-bold mb-1.5">Status Setzen:</p>
                          <div className="flex flex-wrap gap-2">
                            {['Offen', 'In Bearbeitung', 'Angenommen', 'Abgelehnt'].map((st) => (
                              <button 
                                key={st} 
                                onClick={() => updateAppStatus(selectedApp.id, st)}
                                className={`text-xs px-3 py-1.5 rounded-xl font-bold border transition ${
                                  selectedApp.status === st ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-400 border-slate-700'
                                }`}
                              >
                                {st}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="space-y-3 text-sm pt-2">
                          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Arbeitszeit:</p>
                            <p className="text-slate-200 text-xs mt-1">{selectedApp.data.weeklyHours} Std./Woche ({selectedApp.data.activeTimes})</p>
                          </div>
                          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Erfahrung:</p>
                            <p className="text-slate-200 text-xs mt-1 whitespace-pre-wrap">{selectedApp.data.experience}</p>
                          </div>
                          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Motivation:</p>
                            <p className="text-slate-200 text-xs mt-1 whitespace-pre-wrap">{selectedApp.data.motivation}</p>
                          </div>
                          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Szenario 1:</p>
                            <p className="text-slate-200 text-xs mt-1 whitespace-pre-wrap">{selectedApp.data.scenario1}</p>
                          </div>
                          <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                            <p className="text-xs text-indigo-400 font-bold">Szenario 2:</p>
                            <p className="text-slate-200 text-xs mt-1 whitespace-pre-wrap">{selectedApp.data.scenario2}</p>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="h-full flex flex-col items-center justify-center text-slate-500 py-12">
                        <i className="fa-regular fa-hand-pointer text-3xl mb-2"></i>
                        <p className="text-xs">Wähle links eine Bewerbung aus.</p>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* VIEW: USER FORMULAR */}
          {view === "form" && (
            <div className="liquid-glass rounded-3xl p-6 md:p-10 border border-white/10 shadow-2xl">
              <div className="text-center mb-8">
                <h1 className="text-3xl md:text-4xl font-black text-white">MBJC Team Bewerbung</h1>
                <p className="text-xs md:text-sm text-slate-400 mt-1">Wähle deine gewünschte Rolle und bewerbe dich für unser Team.</p>
              </div>

              {!isAppOpen ? (
                <div className="bg-rose-500/10 border border-rose-500/30 rounded-2xl p-8 text-center my-6">
                  <div className="w-16 h-16 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto mb-4 text-3xl">
                    <i className="fa-solid fa-lock"></i>
                  </div>
                  <h2 className="text-xl font-bold text-white mb-2">Bewerbungsphase aktuell geschlossen</h2>
                  <p className="text-slate-300 text-xs max-w-md mx-auto leading-relaxed">
                    Derzeit nehmen wir keine neuen Bewerbungen an. Wir benachrichtigen dich auf unserem Discord-Server, sobald die nächste Phase startet!
                  </p>
                  <a 
                    href={CONFIG.discordUrl} 
                    target="_blank" 
                    className="inline-flex items-center gap-2 mt-6 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl text-xs transition"
                  >
                    <i className="fa-brands fa-discord"></i> Zum Discord Server
                  </a>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-6">
                  <div className="grid grid-cols-2 gap-3 p-1.5 bg-slate-900/80 rounded-2xl border border-slate-800">
                    <button 
                      type="button"
                      onClick={() => setRole("discord_mod")}
                      className={`py-3.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center justify-center gap-2 ${role === "discord_mod" ? "bg-indigo-600 text-white shadow-lg" : "text-slate-400 hover:text-white"}`}
                    >
                      <i className="fa-brands fa-discord text-lg"></i> Discord Mod
                    </button>
                    <button 
                      type="button"
                      onClick={() => setRole("tiktok_mod")}
                      className={`py-3.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center justify-center gap-2 ${role === "tiktok_mod" ? "bg-indigo-600 text-white shadow-lg" : "text-slate-400 hover:text-white"}`}
                    >
                      <i className="fa-brands fa-tiktok text-lg"></i> TikTok Mod
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5">Discord Username / Tag *</label>
                      <input 
                        type="text" 
                        name="discordTag" 
                        placeholder="z.B. user_123" 
                        value={formData.discordTag} 
                        onChange={handleChange} 
                        className="w-full liquid-input p-3 rounded-xl text-sm" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5">Dein Alter *</label>
                      <input 
                        type="number" 
                        name="age" 
                        placeholder="z.B. 16" 
                        value={formData.age} 
                        onChange={handleChange} 
                        className="w-full liquid-input p-3 rounded-xl text-sm" 
                        required 
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5">Wöchentliche Arbeitszeit (Stunden) *</label>
                      <input 
                        type="number" 
                        name="weeklyHours" 
                        placeholder="z.B. 12" 
                        value={formData.weeklyHours} 
                        onChange={handleChange} 
                        className="w-full liquid-input p-3 rounded-xl text-sm" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5">Hauptsächliche Onlinezeiten *</label>
                      <select 
                        name="activeTimes" 
                        value={formData.activeTimes} 
                        onChange={handleChange} 
                        className="w-full liquid-input p-3 rounded-xl text-sm bg-slate-900"
                      >
                        <option value="Mittags & Nachmittags">Mittags & Nachmittags</option>
                        <option value="Nachmittags & Abends">Nachmittags & Abends</option>
                        <option value="Spät-Abends & Nachts">Spät-Abends & Nachts</option>
                        <option value="Ganztags flexibel">Ganztags flexibel</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Hast du Vorerfahrung als Moderator? *</label>
                    <textarea 
                      name="experience" 
                      rows="3" 
                      placeholder="Erzähle von früheren Servern oder Moderations-Aufgaben..." 
                      value={formData.experience} 
                      onChange={handleChange} 
                      className="w-full liquid-input p-3 rounded-xl text-sm" 
                      required
                    ></textarea>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Warum möchtest du ins MBJC-Team? *</label>
                    <textarea 
                      name="motivation" 
                      rows="3" 
                      placeholder="Deine Motivation..." 
                      value={formData.motivation} 
                      onChange={handleChange} 
                      className="w-full liquid-input p-3 rounded-xl text-sm" 
                      required
                    ></textarea>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">Szenario: Zwei User streiten sich heftig. Wie reagierst du? *</label>
                    <textarea 
                      name="scenario1" 
                      rows="3" 
                      placeholder="Schritt-für-Schritt Vorgehensweise..." 
                      value={formData.scenario1} 
                      onChange={handleChange} 
                      className="w-full liquid-input p-3 rounded-xl text-sm" 
                      required
                    ></textarea>
                  </div>

                  <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-4 px-6 rounded-2xl transition duration-300 shadow-xl shadow-indigo-600/30">
                    <i className="fa-solid fa-paper-plane mr-2"></i> Bewerbung Absenden
                  </button>
                </form>
              )}
            </div>
          )}

          {/* VIEW: ERFOLG */}
          {view === "success" && submittedTicket && (
            <div className="liquid-glass rounded-3xl p-8 text-center border border-emerald-500/30 max-w-lg mx-auto shadow-2xl">
              <div className="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto mb-4 text-emerald-400 text-3xl">
                <i className="fa-solid fa-check"></i>
              </div>
              <h2 className="text-2xl font-black text-white mb-1">Bewerbung Gespeichert!</h2>
              <p className="text-xs text-slate-400 mb-4">Deine Ticket-Nummer:</p>
              
              <div className="bg-slate-900 p-3.5 rounded-xl font-mono text-indigo-400 font-bold text-lg mb-6 border border-slate-800 tracking-wider">
                {submittedTicket.id}
              </div>

              <div className="flex gap-3">
                <button onClick={() => setView("form")} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-xl text-xs transition">
                  Zurück
                </button>
                <a href={CONFIG.discordUrl} target="_blank" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-1">
                  <i className="fa-brands fa-discord"></i> Zum Discord
                </a>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
